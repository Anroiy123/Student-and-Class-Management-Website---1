services:
  # 1. Backend API (Node.js)
  - type: web
    name: student-management-api
    env: node                     # Sửa runtime -> env
    region: singapore             # Backend được phép chọn vùng
    plan: free
    # LƯU Ý: Chỉ dùng 'apps/api' nếu bạn tổ chức code dạng monorepo.
    # Nếu code backend nằm ngay thư mục gốc, hãy sửa thành: npm install && npm run build
    buildCommand: cd apps/api && npm install && npm run build
    startCommand: cd apps/api && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
    healthCheckPath: /health

  # 2. Frontend React App (Static Site)
  - type: static                  # Sửa web -> static
    name: student-management-web
    env: static                   # Sửa runtime -> env
    # Đã xóa dòng 'plan: free' (Static site không cần dòng này)
    
    # LƯU Ý: Kiểm tra lại đường dẫn thư mục code của bạn
    buildCommand: cd apps/web && npm install && npm run build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html